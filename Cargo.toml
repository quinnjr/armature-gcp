[package]
name = "armature-gcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-gcp"
homepage = "https://quinnjr.github.io/armature"
description = "Google Cloud Platform services integration for Armature - dynamically loadable and DI-ready"
keywords = ["gcp", "google-cloud", "pubsub", "bigquery"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["sync"] }
async-trait = "0.1"

# GCP authentication
gcp_auth = { version = "0.12", optional = true }

# Credentials construction for the gRPC-based SDKs (storage/pubsub). This is the
# exact same google-cloud-auth version those SDKs compile against, so the
# `Credentials` type unifies and can be threaded into their client builders.
google-cloud-auth = { version = "1.16", optional = true, default-features = false }

# GCP services (all optional)
google-cloud-storage = { version = "1.18", optional = true }
google-cloud-pubsub = { version = "1.4", optional = true }
# `gcloud-spanner` is the maintained continuation of `google-cloud-spanner` 0.x
# (same author/API, renamed). It uses `gcloud-auth` 1.x → jsonwebtoken 10.x;
# google-cloud-spanner 0.33 pinned google-cloud-auth 0.17 → jsonwebtoken 9.3.1
# (CVE-2026-25537).
gcloud-spanner = { version = "1.8", optional = true }
gcloud-bigquery = { version = "1.7", optional = true }

# HTTP client for REST APIs
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
serde_json = "1.0"

[features]
default = []
# Core auth
auth = ["gcp_auth"]
# Individual services
storage = ["google-cloud-storage", "google-cloud-auth", "auth"]
pubsub = ["google-cloud-pubsub", "google-cloud-auth", "auth"]
spanner = ["gcloud-spanner", "auth"]
bigquery = ["gcloud-bigquery", "auth"]
# REST-based services (use HTTP client)
cloud-run = ["reqwest", "auth"]
cloud-functions = ["reqwest", "auth"]
secret-manager = ["reqwest", "auth"]
# Service groups
data = ["storage", "spanner", "bigquery"]
messaging = ["pubsub"]
compute = ["cloud-run", "cloud-functions"]
# All services
all = ["data", "messaging", "compute", "secret-manager"]

